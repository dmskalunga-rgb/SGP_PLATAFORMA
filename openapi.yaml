  "components": {
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-sgp_session"
      },
      "preauthCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-sgp_preauth"
      },
      "csrf": {
        "type": "apiKey",
        "in": "header",
        "name": "X-CSRF-Token"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "error": {
            "type": "string"
          },
          "request_id": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "error",
          "request_id"
        ]
      },
      "Healthy": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ok"
            ]
          }
        },
        "required": [
          "status"
        ]
      },
      "Session": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "user": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string",
                "format": "uuid"
              },
              "username": {
                "type": "string"
              },
              "display_name": {
                "type": "string"
              }
            },
            "required": [
              "id",
              "username",
              "display_name"
            ]
          },
          "session": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "created_at": {
                "type": "string",
                "format": "date-time"
              },
              "expires_at": {
                "type": "string",
                "format": "date-time"
              },
              "idle_expires_at": {
                "type": "string",
                "format": "date-time"
              },
              "authentication_strength": {
                "type": "string",
                "enum": [
                  "PASSWORD"
                ]
              }
            },
            "required": [
              "created_at",
              "expires_at",
              "idle_expires_at",
              "authentication_strength"
            ]
          },
          "csrf_token": {
            "type": "string"
          }
        },
        "required": [
          "user",
          "session",
          "csrf_token"
        ]
      }
    }
  }
}
