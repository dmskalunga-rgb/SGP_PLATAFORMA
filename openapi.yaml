  "openapi": "3.0.3",
  "info": {
    "title": "SGP-DISPO foundation and identity API",
    "version": "0.1.0",
    "description": "M1B identity/session only. HTTPS required for authentication. Exact configured Origin and X-CSRF-Token required on mutations; no business authorization engine."
  },
