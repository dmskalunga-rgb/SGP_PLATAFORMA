            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "target_id": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "action": {
                    "type": "string",
                    "enum": [
                      "REVOKE_ONE",
                      "REVOKE_ALL",
                      "ACTIVE",
                      "INACTIVE",
                      "LOCKED",
                      "DISABLED"
                    ]
                  },
                  "session_id": {
                    "type": "string",
                    "format": "uuid"
                  }
                },
