    "title": "SGP-DISPO foundation, identity and authorization API",
    "version": "0.2.0",
    "description": "M1C IAM enforcement. HTTPS, exact Origin and session-bound CSRF on mutations. Default deny; PostgreSQL binding, effective grants, ABAC and FORCE RLS are authoritative. Minimal proof UI only; M1D and M2 are not implemented."
  },
